openapi: 3.0.3
info:
    title: H Plus Sports API
    version: 1.0.0
tags:
  - name: Product
    description:  Operations with products 
  - name: Article
    description:  Operations with articles     
paths: 
  /product/{productId}:
    get: 
      parameters: 
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/SecurityHeader'    
      responses: 
        '200':
          description: This is a product from the catalog
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/Product'
            application/xml: 
              schema: 
                $ref: '#/components/schemas/Product'    
        '500':
            $ref: '#/components/responses/500ApiError'        
      tags: 
        - Product                           
  /product: 
    post:
      security: 
        - apiKey: []
      description: Add a product to the catalog
      requestBody: 
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/Product'
      responses: 
        '201':
            description: The product has been created.
        '500':
            $ref: '#/components/responses/500ApiError'                 
      tags: 
        - Product 
    get:
      parameters: 
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'    
      tags:
        - Product  
      responses: 
        '200':
          description: This is a list of the products in the catalog
          content: 
            application/json: 
              schema: 
                type: array
                items: 
                  $ref: '#/components/schemas/Product' 
        '500':
            $ref: '#/components/responses/500ApiError'                             
  /article:
    post:
      security:  
        - apiKey: []
      description: Add an article
      requestBody: 
        content: 
          application/json: 
            schema: 
              $ref: '#/components/schemas/Article'
      responses: 
        '201':
            description: The article has been created.
        '500':
            $ref: '#/components/responses/500ApiError'                 
      tags: 
        - Article 
    get:
      tags:
        - Article
      responses: 
        '200':
          description: This is a page of articles
          content: 
              application/json: 
                schema: 
                  $ref: '#/components/schemas/Article'
        '500':
            $ref: '#/components/responses/500ApiError'                    
components: 
  securitySchemes:
    apiKey:
      type: apiKey
      name: api-key
      in: header
  parameters: 
    ProductId:
      in: path
      name: productId
      required: true
      schema: 
        type: integer
        example: 12345
    SecurityHeader:
      in: header    
      name: custom-security-header
      required: false
      schema: 
        type: integer
        example: 12312-323423-2323
    PageNumber:
        in: query
        name: pageNumber
        description: Page number to return
        required: false
        schema:
          type: integer
          example: 1
    PageSize:
      in: query
      name: pageSize
      description: Number of results in the page
      required: false
      schema:
        type: integer
        example: 10
        maximum: 100              
  schemas: 
    Product:
      type: object
      required: 
        - name
      properties: 
        id:
          type: integer
          example: 400
        name:
          type: string
          example: Lemon Water 
        description:
            type: string
            example: Lemon Water 
        image_title: 
            type: string
            example: mineral-water-lemon-lime
        image:
            type: string
            example: https://hplussport.com/images/1234
    Article:
      type: object
      properties: 
        createdDate:
          type: string
          format: date
        tagline:
          type: string
        content:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string            
  responses: 
    500ApiError:
      description: This is unexpected error
      content: 
        application/json: 
          schema: 
            type: object
            properties: 
              statusCode:
                type: string
                example: 500
              message:
                type: string
                example: This is an error